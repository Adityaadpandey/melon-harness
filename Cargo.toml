[package]
name = "melon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
fancy-regex = "0.20.0"
futures = "0.3.34"
futures-util = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
libc = "0.2.191"
rand = "0.10.3"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "form"] }
rustyline = "15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
shell-words = "1.1.1"
similar = "3.2.1"
tempfile = "3.27.0"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-normalization = "0.1.26"
unicode-width = "0.2.2"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"
which = "8.0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Tests and dev builds stay quick to compile; dependencies are optimised so scripted agent runs don't crawl.
[profile.dev.package."*"]
opt-level = 2
