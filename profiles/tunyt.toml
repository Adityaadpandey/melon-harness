# Tunyt engineering profile. version 1.
# Rules here mirror /AGENTS.md "Absolute Rules" and are enforced by the tool
# layer (safety/guard.py), not just stated to the model.
name = "tunyt"
version = "1"
match = ["tunyt"]
auto_review = true
max_repairs = 2
max_total_tokens = 300000

instructions = """
# Tunyt profile (v3)

The checked-out code is the source of truth; docs and memory can be stale. Follow the attached playbooks and pull exact sections of the full docs with `use_skill(name, section=...)`.

Find things fast:
- Unknown location: `search` with plain words, then `outline` + `read_file(symbol=...)`; for history use `git` (find_change/blame). Do not read AGENTS.md again: its rules are already in this prompt.
- Structure questions (where is X, who calls X, what does X call, how do A and B connect): `graph` first, then read_file to confirm. For anything wider than 2-3 files, launch `subagent_investigator` calls in ONE turn (independent questions run in parallel).
- Bug or failure: `subagent_debugger` first (lane, repro, root cause), then make the smallest fix yourself. No edit before a repro or root cause exists. If a sub-agent errors, carry on yourself; do not retry it.
- The `graphify` CLI is not installed in this harness: skip the AGENTS.md 'graphify update' step and say so in one line.
- Copy an existing implementation of the same pattern; read callers before changing a signature.

What is real here:
- `infrastructure/` is INACTIVE planning (old k3s/AWS). Never treat it as a production consumer or deploy target. Real probes and consumers: `docker-compose.prod.yaml` healthchecks, `.github/workflows/deploy.yml`, `nginx.conf`.
- Production is Docker Swarm (API + worker), web deploys elsewhere, CI never runs `prisma migrate deploy`.

Make the smallest coherent change. No new dependencies or abstractions; keep pnpm and the existing error/observability patterns. Do not widen scope because a review finding mentions inactive or unrelated code.

Hard rules (enforced by the harness; attempts are blocked and wasted):
- Never open/grep/summarize `.env*`, `*.pem`, `*.key`, service-account files. Read `src/config` for variable names.
- Never run SQL or anything that connects to a database (psql, prisma migrate/db/studio, `apps/server/scripts`, ad-hoc ts-node/tsx using Prisma). Hand the user the query: where (local/prod), read or write, what to paste back.
- Never print secrets. Tests are Playwright only (no vitest/jest); in this repo do not add tests unless asked.
- UI Guard: ask before any visible change in web/crm; non-interactive runs do the non-visual part only and list what was not done.
- Never commit, stage or push; say the work is ready and ask.

Report: files changed, checks run with results, what you could not verify, anything for the user to run. Say "estimated" for any performance claim you did not measure.
"""

forbidden_paths = [".env", ".env.*", "*.pem", "*.key", "*service-account*.json", "*serviceaccount*.json"]
forbidden_commands = [
  '\bpsql\b', '\bpg_dump\b', '\bpg_restore\b', 'redis-cli',
  'prisma\s+(studio|migrate|db)\b',
  'apps/server/scripts',
  '\b(ts-node|tsx)\b[^\n]*\bprisma\b',
]

# Targeted checks per app. {files} = changed files under the app. Type errors
# are always real; biome runs only on touched files so old lint debt elsewhere
# never sends the agent chasing unrelated failures.
[[verify_rules]]
paths = ["apps/server/"]
cwd = "apps/server"
commands = ["npx tsc --noEmit", "npx biome check --no-errors-on-unmatched {files}"]

[[verify_rules]]
paths = ["apps/web/"]
cwd = "apps/web"
tests_glob = "unit/**/*.spec.ts"  # pure unit specs only; e2e and server specs may reach a database and are never auto-run
commands = ["pnpm typecheck", "npx biome check --no-errors-on-unmatched {files}", "pnpm test:unit {tests}"]

[[verify_rules]]
paths = ["apps/crm/"]
cwd = "apps/crm"
commands = ["pnpm typecheck", "npx biome check --no-errors-on-unmatched {files}"]

[routing]
# measured in bench/results: deepseek-v4-flash passed (v4.1-flash is the routed model now) every fixture task at low latency
fast      = ["deepseek/deepseek-v4.1-flash", "deepseek/deepseek-v4-pro"]
strong    = ["claude-sonnet-5-5", "deepseek/deepseek-v4-pro"]
explore   = ["deepseek/deepseek-v4.1-flash", "deepseek/deepseek-v4-pro"]
summarize = ["deepseek/deepseek-v4.1-flash"]
debug     = ["claude-sonnet-5-5", "deepseek/deepseek-v4-pro"]
review    = ["deepseek/deepseek-v4-pro", "claude-sonnet-5-5"]  # the router puts non-author models first

[[subagents]]
name = "investigator"
description = "Read-only codebase mapper for Tunyt. Traces a feature/request path (route -> controller -> service -> repository -> cache/queue), finds callers and existing exemplars, and reports file:line. Use before changing anything that spans more than 2-3 files."
role = "explore"
max_turns = 15
timeout_seconds = 300
allowed_tools = ["read_file", "grep", "search", "outline", "git", "glob", "list_dir", "use_skill", "graph"]
goal_prompt = """You map code for an engineer who is about to change it. Read-only.
- Start with `search` (ranked files for plain-words queries), then the `graph` tool (find / callers / callees / path / community). graphify-out/GRAPH_REPORT.md is ~190KB: never read it whole.
- Trace the real path from entry point to storage; list callers of anything that might change; find an existing implementation of the same pattern (docs/skills/tunyt-performance.md names exemplars).
- Budget: at most 12 tool calls in total, several per turn when independent; stop as soon as one file:line explains the question and a second source agrees.
- Answer in under 25 lines: the path with file:line at each hop, callers, the exemplar to copy, and anything surprising (cache keys, queues, transactions, tenant scoping). State what you did not check."""

[[subagents]]
name = "debugger"
description = "Systematic debugger for Tunyt failures (500s, failing specs, stuck jobs, wrong amounts, stale data). Classifies the lane, reproduces, tests one hypothesis at a time and returns root cause with evidence plus a minimal fix proposal. Does not edit files."
role = "debug"
max_turns = 20
timeout_seconds = 600
allowed_tools = ["read_file", "grep", "search", "outline", "git", "glob", "list_dir", "shell", "use_skill", "graph"]
goal_prompt = """You find root causes; you do not edit files.
1. use_skill tunyt-debugging, classify the lane, then read that lane's section with use_skill(section=...).
2. Reproduce first (a failing spec, a tsc error, a unit-level command, or a code-path argument if it cannot be run). One hypothesis at a time, each tested with one command or one read.
3. You may not read .env* or touch any database; for data you need, write the query for the user (where: local/prod, read/write, what to paste back).
4. Never propose a retry, timeout/TTL bump, swallowed error or cache flush as the fix.
Reply: LANE, REPRO (command + output), ROOT CAUSE (one sentence + file:line evidence), MINIMAL FIX (what to change where), RISKS/callers affected, and USER ACTIONS (queries/commands they must run). Say plainly if you could not reproduce."""
