<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="mew, the coding agent that proves its work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1530"/><stop offset="1" stop-color="#0e1a22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fc7"/><stop offset="0.55" stop-color="#c3a6ff"/><stop offset="1" stop-color="#8ff0c4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <text x="70" y="128" font-family="Menlo, Consolas, monospace" font-size="32" fill="#ff8fc7">=^0.0^=</text>
  <text x="70" y="212" font-family="Menlo, Consolas, monospace" font-size="96" font-weight="700" fill="url(#ink)">mew</text>
  <text x="300" y="196" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#ecebf5">The coding agent that proves its work.</text>
  <text x="300" y="232" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9a98b0">verify · review · ground · and never send a token twice</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17" text-anchor="middle">
    <rect x="70" y="252" width="150" height="30" rx="15" fill="#2a2147"/><text x="145" y="272" fill="#ff8fc7">fast</text>
    <rect x="236" y="252" width="150" height="30" rx="15" fill="#2a2147"/><text x="311" y="272" fill="#c3a6ff">cheap</text>
    <rect x="402" y="252" width="150" height="30" rx="15" fill="#2a2147"/><text x="477" y="272" fill="#8ff0c4">honest</text>
    <rect x="568" y="252" width="150" height="30" rx="15" fill="#2a2147"/><text x="643" y="272" fill="#ffd28f">safe</text>
  </g>
</svg>
