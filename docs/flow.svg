<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="How a request flows through mew">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a98b0"/></marker>
    <style>
      .box{fill:#1b1530;stroke:#c3a6ff;stroke-width:1.5}
      .gate{fill:#13271f;stroke:#8ff0c4;stroke-width:1.5}
      .bad{fill:#2c1620;stroke:#ff8fc7;stroke-width:1.5}
      .t{font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ecebf5}
      .s{font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#9a98b0}
      .l{stroke:#9a98b0;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .r{stroke:#ff8fc7;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="520" rx="16" fill="#0e0c18"/>

  <rect class="box" x="40" y="30" width="200" height="64" rx="10"/>
  <text class="t" x="140" y="58" text-anchor="middle">your request</text>
  <text class="s" x="140" y="78" text-anchor="middle">classified, no model call</text>

  <rect class="box" x="300" y="30" width="200" height="64" rx="10"/>
  <text class="t" x="400" y="58" text-anchor="middle">scout</text>
  <text class="s" x="400" y="78" text-anchor="middle">read-only, cheap model</text>

  <rect class="box" x="560" y="30" width="200" height="64" rx="10"/>
  <text class="t" x="660" y="58" text-anchor="middle">main model</text>
  <text class="s" x="660" y="78" text-anchor="middle">fast / default / strong</text>

  <rect class="box" x="780" y="30" width="190" height="64" rx="10"/>
  <text class="t" x="875" y="58" text-anchor="middle">edit</text>
  <text class="s" x="875" y="78" text-anchor="middle">read first, diff approved</text>

  <path class="l" d="M240 62H298"/><path class="l" d="M500 62H558"/><path class="l" d="M760 62H778"/>

  <rect class="gate" x="780" y="170" width="190" height="64" rx="10"/>
  <text class="t" x="875" y="198" text-anchor="middle">verification gate</text>
  <text class="s" x="875" y="218" text-anchor="middle">checks on changed files</text>
  <path class="l" d="M875 94V168"/>

  <rect class="bad" x="560" y="170" width="170" height="64" rx="10"/>
  <text class="t" x="645" y="198" text-anchor="middle">repair</text>
  <text class="s" x="645" y="218" text-anchor="middle">up to max_repairs</text>
  <path class="r" d="M778 202H732"/>
  <text class="s" x="755" y="192" text-anchor="middle">fail</text>
  <path class="r" d="M645 170V100"/>

  <rect class="gate" x="780" y="300" width="190" height="64" rx="10"/>
  <text class="t" x="875" y="328" text-anchor="middle">independent review</text>
  <text class="s" x="875" y="348" text-anchor="middle">different model, real diff</text>
  <path class="l" d="M875 234V298"/>
  <text class="s" x="890" y="268">pass</text>

  <rect class="bad" x="560" y="300" width="170" height="64" rx="10"/>
  <text class="t" x="645" y="328" text-anchor="middle">one fix</text>
  <text class="s" x="645" y="348" text-anchor="middle">then re-review</text>
  <path class="r" d="M778 332H732"/>
  <text class="s" x="755" y="322" text-anchor="middle">findings</text>

  <rect class="gate" x="780" y="430" width="190" height="64" rx="10"/>
  <text class="t" x="875" y="458" text-anchor="middle">citation check</text>
  <text class="s" x="875" y="478" text-anchor="middle">every path:line is real</text>
  <path class="l" d="M875 364V428"/>
  <text class="s" x="890" y="398">clean</text>

  <rect class="box" x="300" y="430" width="400" height="64" rx="10"/>
  <text class="t" x="500" y="458" text-anchor="middle">verified · unverified · verification_failed</text>
  <text class="s" x="500" y="478" text-anchor="middle">failed · done_no_changes (never a bare "done")</text>
  <path class="l" d="M778 462H702"/>

  <text class="s" x="40" y="170">Dashed pink = a failure path.</text>
  <text class="s" x="40" y="190">Every one has a next step.</text><text class="s" x="40" y="220">A backup is taken before the run,</text><text class="s" x="40" y="240">so /undo always works.</text>
</svg>
