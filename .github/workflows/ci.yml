# Build and test on all three systems. Windows is the newest target: it must compile, and its test run is
# reported but does not block yet, because some tests still assume a Unix shell and /tmp.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-2025' }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2 # reuse compiled dependencies between runs
      - run: cargo test # the release build (fat LTO, slow) only happens in release.yml on a tag
