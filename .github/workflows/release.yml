# Push a tag like v0.1.0 and this builds melon for mac and linux and attaches the tarballs to the GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-14 }
          - { target: x86_64-apple-darwin,       os: macos-13 }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          name=melon-${{ matrix.target }}
          tar -czf $name.tar.gz -C target/${{ matrix.target }}/release melon
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: melon-${{ matrix.target }}.tar.gz*
