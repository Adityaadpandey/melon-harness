# Push a tag like v0.1.0 and this builds zerd for mac, linux (static) and windows and attaches the tarballs to the GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-15 }
          - { target: x86_64-apple-darwin,       os: macos-15 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc,    os: windows-2025 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # musl builds are fully static, so the Linux binary runs on any distro (old glibc, Alpine, ...)
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $name = "zerd-${{ matrix.target }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/zerd.exe -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: package
        if: "!contains(matrix.target, 'windows')"
        run: |
          name=zerd-${{ matrix.target }}
          tar -czf $name.tar.gz -C target/${{ matrix.target }}/release zerd
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zerd-${{ matrix.target }}.tar.gz*
            zerd-${{ matrix.target }}.zip*
