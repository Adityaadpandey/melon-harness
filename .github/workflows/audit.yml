# Checks dependencies against the RustSec advisory list, weekly and whenever the lockfile changes.
name: audit

on:
  schedule: [{ cron: "0 6 * * 1" }]
  push:
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
